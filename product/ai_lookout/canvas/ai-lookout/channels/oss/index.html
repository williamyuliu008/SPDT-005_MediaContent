<script>
(async function() {
    try {
        const resp = await fetch('../../search/index.json');
        const data = await resp.json();
        const chData = data.channels && data.channels['oss'];
        if (!chData || !chData.items) return;
        const dateMap = {};
        for (const item of chData.items) {
            const date = item.date;
            if (!date || dateMap[date]) continue;
            dateMap[date] = item;
        }
        document.querySelectorAll('.archive-item').forEach(item => {
            const dateEl = item.querySelector('.date');
            if (!dateEl) return;
            const date = dateEl.textContent.trim();
            const topSignal = dateMap[date];
            if (topSignal && topSignal.title) {
                const summary = document.createElement('div');
                summary.className = 'archive-summary';
                summary.textContent = topSignal.title;
                item.appendChild(summary);
            }
        });
    } catch(e) {}
})();
</script>
