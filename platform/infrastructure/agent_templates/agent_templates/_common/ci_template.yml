# DLV Common CI Template
# 用途: 内阁项目标准 CI 流程
# 放置: .github/workflows/ci.yml

name: DLV CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pyyaml

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Quality gate (DLV)
        run: |
          echo "=== DLV Quality Gate ==="
          echo "Project: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"
          # CQS auto-check
          TEST_COUNT=$(find tests/ -name "test_*.py" 2>/dev/null | wc -l)
          echo "Test files: $TEST_COUNT"
          if [ "$TEST_COUNT" -eq 0 ]; then
            echo "::warning::No test files found — CQS penalty"
          fi
          echo "CI check passed"

  deploy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Structure check
        run: |
          errors=0
          for dir in src config tests; do
            if [ ! -d "$dir" ]; then
              echo "::error::Missing directory: $dir"
              errors=$((errors+1))
            fi
          done
          if [ ! -f "README.md" ]; then
            echo "::warning::Missing README.md"
          fi
          if [ $errors -gt 0 ]; then
            echo "Structure check failed: $errors errors"
            exit 1
          fi
          echo "Structure check passed"
