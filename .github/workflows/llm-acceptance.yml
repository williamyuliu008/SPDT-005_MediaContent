# ============================================================
# llm-acceptance.yml — SPDT-005 真实 LLM 验收 CI/CD
# ============================================================
#
# 触发条件：
#   - push 到 main / feat/* / fix/* / content/* 分支
#   - 手动触发（workflow_dispatch）
#
# 执行内容：
#   Step 1：设置 Python 3.11 环境
#   Step 2：注入 DEEPSEEK_API_KEY（从 GitHub Secrets）
#   Step 3：运行 _run_all_llm.py（所有内容类型真实 LLM 验收）
#   Step 4：验证 policy_audit.jsonl 记录存在
#   Step 5：上传结果 artifact
#
# _run_all_llm.py 必须满足的断言：
#   ✓ exit code = 0（所有类型 PASS，无 crash）
#   ✓ 每个 scorecard score ≥ 各自阈值（science_research≥70 / deep_industry≥85 / oped≥70）
#   ✓ 每个 markdown 正文长度 ≥ §4.5 最低要求
#   ✓ 所有维度分数 ≥ 各自否决线
#   ✓ policy_audit.jsonl 有本次运行的记录
#
# 失败处理：
#   CI 红 → 禁止合并 → 修复后重新 push
#
# 参考：SOP v1.4 §11.3
# ============================================================

name: SPDT-005 LLM Acceptance

on:
  push:
    branches:
      - main
      - 'feat/*'
      - 'fix/*'
      - 'content/*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tools/adversarial_audit.py'
      - 'tools/audit_analyzer.py'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tools/adversarial_audit.py'
      - 'tools/audit_analyzer.py'
  workflow_dispatch:
    inputs:
      content_type:
        description: 'Run specific content type (or "all")'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - science_research
          - deep_industry_report
          - oped_argument

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ─────────────────────────────────────────────────────────
  # Job 1: LLM Acceptance Test（所有类型）
  # ─────────────────────────────────────────────────────────
  llm-acceptance:
    name: LLM Acceptance (${{ inputs.content_type || 'all' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Step 1: Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -q openai requests
          # Verify _run_all_llm.py exists
          test -f _run_all_llm.py && echo "_run_all_llm.py found" || (echo "_run_all_llm.py NOT found" && exit 1)

      # Step 4: Inject DeepSeek API Key
      - name: Read DeepSeek API Key
        run: |
          if [ -n "${{ secrets.DEEPSEEK_API_KEY }}" ]; then
            echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" >> $GITHUB_ENV
            echo "✅ DEEPSEEK_API_KEY injected"
          else
            echo "⚠️  DEEPSEEK_API_KEY not set — CI will run in MOCK mode (skip assertion)"
            echo "DEEPSEEK_API_KEY=" >> $GITHUB_ENV
          fi

      # Step 5: Run LLM acceptance tests
      - name: Run LLM acceptance (${{ inputs.content_type || 'all' }})
        id: run-acceptance
        run: |
          echo "========================================"
          echo "SPDT-005 LLM Acceptance Test"
          echo "Mode: $([ -n '${{ secrets.DEEPSEEK_API_KEY }}' ] && echo 'REAL LLM' || echo 'MOCK (no API key)')"
          echo "Content Type: ${{ inputs.content_type || 'all' }}"
          echo "Run Timestamp: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "========================================"

          python _run_all_llm.py
          EXIT_CODE=$?

          echo "========================================"
          echo "Exit code: $EXIT_CODE"
          echo "========================================"

          # Always exit with proper code (CI failure if non-zero)
          exit $EXIT_CODE

      # Step 6: Verify policy_audit.jsonl was written
      - name: Verify audit log exists
        run: |
          AUDIT_FILE="platform/5_deliver/checkpoint/policy_audit.jsonl"
          if [ -f "$AUDIT_FILE" ]; then
            LINES=$(wc -l < "$AUDIT_FILE")
            echo "✅ policy_audit.jsonl exists: $LINES lines"
          else
            echo "⚠️  policy_audit.jsonl not found (may be first run in mock mode)"
          fi

      # Step 7: Upload results artifact
      - name: Upload LLM acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-acceptance-${{ github.run_number }}-${{ github.run_id }}
          path: |
            platform/5_deliver/results/delivered/**/*.md
            platform/5_deliver/checkpoint/policy_audit.jsonl
            _llm_raw_output.txt
          retention-days: 14
          compression-level: 9

  # ─────────────────────────────────────────────────────────
  # Job 2: Module health check（快速，无需 API key）
  # ─────────────────────────────────────────────────────────
  module-health:
    name: Module Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Module import check
        run: |
          python -c "
          import sys, importlib.util
          from pathlib import Path

          root = Path('platform')
          modules = [
            'platform/shared/llm_gateway.py',
            'platform/1_ingest/radar/radar_science_fact.py',
            'platform/3_render/engines/text/render_science_fact.py',
            'platform/4_adapt/scorecard/scorecard_science_fact.py',
            'platform/2_structure/article/article_science_fact.py',
          ]
          for m in modules:
              p = root.parent / m
              if not p.exists():
                  print(f'❌ MISSING: {m}')
                  sys.exit(1)
              spec = importlib.util.spec_from_file_location('mod', str(p))
              if spec is None:
                  print(f'❌ SPEC ERROR: {m}')
                  sys.exit(1)
              print(f'✅ {m}')
          print('All modules OK')
          "

      - name: Upload module list
        uses: actions/upload-artifact@v4
        with:
          name: module-health-report
          path: platform/1_ingest/radar/,platform/3_render/,platform/4_adapt/
          retention-days: 3
