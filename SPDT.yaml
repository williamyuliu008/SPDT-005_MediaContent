# SPDT-005: 媒体内容制造 (Media Content Manufacturing)
# 版本：v2.1（2026-07-29 更新）
# 核心变更：协调型五阶段流水线重构

spdt_id: SPDT-005
spdt_name: 媒体内容制造
spdt_name_en: Media Content Manufacturing
owner_agent: agent-e926h
created: 2026-07-10
version: 2.1
last_updated: 2026-07-29

description: |
  以 smarttext_router 路由器 + 6 集群架构为核心，覆盖从实时快讯到深度长文、
  从知识科普到品牌创意的全媒体内容自动制造。配合 autopublish 多渠道发布引擎，
  实现"数据源 → 成品内容 → 一键分发"的全自动化。

  架构对齐: 内容制造管线执行规范 v1.0 (SOP v4.0)
  架构类型: 协调型（外部 PDT 生产，SPDT-005 做编排分发）
  MODLIB纳管: D:/1_omas/MODLIB/

# =============================================================================
# 流水线架构（v2.1 协调型五阶段）
# =============================================================================
pipeline:
  name: 媒体内容协调流水线
  architecture_type: coordination          # 协调型：外部 PDT 生产，本 PDT 编排分发
  vs_spd04: |
    SPDT-004 = 自含生产型（代码全在内部）
    SPDT-005 = 协调型（通过 junction 引用外部 PDT）

  stages:
    - id: 1_ingest
      name: 知识摄入
      description: 入口路由 + ContentSpec 生成（不生产内容，只做分发决策）
      junction_ref: platform/infrastructure/smarttext_router
      SOP_stage: M0 + M1
      status: active
      output: ContentSpec YAML（路由决策）

    - id: 2_structure
      name: 结构化加工
      description: ManuscriptsEngine 多 Agent 协作，生成 article_v2 结构化稿件
      junction_ref: platform/services/ManuscriptsEngine
      external_PDT: PT-047_SocSciAgent
      SOP_stage: M2 + M3
      status: active
      maturity: 0.7
      output: article_v2 / breaking_news / tech_explainer

    - id: 3_render
      name: 渲染生产
      description: 质量门禁 + 多形态渲染（图文/音频/视频/卡片）
      junction_ref: platform/services/ManuscriptsEngine/pipeline_runner.py
      SOP_stage: M4
      status: active
      quality_gates: [G-SOURCE, G-TIMELINESS, G-FACTUAL, G-STYLE, G-STRUCTURE, G-FORMAT]
      shared_from: SPDT-004 3_render/video_factory
      output: 图文版 / 音频版 / 视频版 / 卡片版

    - id: 4_adapt
      name: 自适应编排
      description: 质量记分卡 + 品牌化编排（ ManuscriptsEngine agents/review + orchestration）
      junction_ref: platform/services/ManuscriptsEngine/agents
      SOP_stage: M5
      status: active
      scorecard: content_scorecard_v1
      output: 评分报告 + 品牌化建议

    - id: 5_deliver
      name: 触达交付
      description: 多渠道自动分发（web/feeds/mobile/feishu/wechat_mp）
      junction_ref: platform/infrastructure/autopublish
      SOP_stage: M6
      status: active
      channels: [web, feeds, mobile, feishu, wechat_mp]
      output: 发布记录 + 触达报告

# =============================================================================
# Junction 映射（协调型核心）
# =============================================================================
junction_map:
  """
  协调型 PDT 间耦合原则：
  - SPDT-005 不复制外部 PDT 代码，仅通过 junction 引用
  - junction_ref 指向 SPDT-005 内部逻辑命名空间（实际指向外部 PT）
  - PT-047_SocSciAgent 是实际生产引擎，SPDT-005 是编排协调层
  """
  1_ingest:
    logical_namespace: platform/infrastructure/smarttext_router
    external_source: platform/infrastructure/smarttext_router/smarttext_router
    role: M0 入口路由器 + M1 ContentSpec 生成
    junction_type: internal    # 内部已存在

  2_structure:
    logical_namespace: platform/services/ManuscriptsEngine
    external_source: PT-047_SocSciAgent
    role: M2+M3 体裁匹配 + 知识源连通 + 创作流水线
    junction_type: external    # 外部 PDT 生产

  3_render:
    logical_namespace: platform/services/ManuscriptsEngine/pipeline_runner.py
    external_source: PT-047_SocSciAgent/pipeline_runner
    role: M4 质量约束应用 + 多形态渲染
    junction_type: external    # 复用 SPDT-004 video_factory

  4_adapt:
    logical_namespace: platform/services/ManuscriptsEngine/agents
    external_source: PT-047_SocSciAgent/agents
    role: M5 质量记分卡 + 知识资产注册
    junction_type: external    # 外部 PDT

  5_deliver:
    logical_namespace: platform/infrastructure/autopublish
    external_source: platform/infrastructure/autopublish
    role: M6 人类检查点 + 多渠道分发
    junction_type: internal    # 内部已存在

# =============================================================================
# SOP M0-M6 对齐
# =============================================================================
sop:
  family: content_manufacturing
  version: v4.0
  execution_spec: "D:/1_omas/governance/内容制造管线执行规范_v1.0.md"
  human_checkpoints:
    m1: "ContentSpec YAML 需求确认（smarttext_router 输出审查）"
    m4: "敏感内容签批（G-SOURCE/G-TIMELINESS 灰区触发）"
    m6: "最终交付确认 + 发布前检查（autopublish 输出）"

# =============================================================================
# MODLIB 消费声明
# =============================================================================
modlib_consumption:
  schemas:
    - id: article_v2_schema
      version: "1.0.0"
      path: D:/1_omas/MODLIB/content_manufacturing/schemas/article_v2_schema.json
      status: pending    # 待从 ManuscriptsEngine 提取
    - id: quality_gate_schema
      version: "1.0.0"
      path: D:/1_omas/MODLIB/content_manufacturing/schemas/quality_gate_schema.json
      status: pending    # 待建立
  templates:
    - id: content_spec_template
      version: "1.0.0"
      path: D:/1_omas/MODLIB/content_manufacturing/content_spec/content_spec_media.yaml
      status: pending    # media 领域 ContentSpec 模板
  registries:
    - id: genre_registry
      version: "1.0.0"
      path: D:/1_omas/MODLIB/content_manufacturing/genre_registry/
      domains: [education, media]
  protocols:
    - id: IF-A_scene_json_v2
      version: "2.0.0"
      path: D:/1_omas/MODLIB/content_manufacturing/interface_protocols/IF-A_scene_json_v2.schema.json
    - id: IF-B_video_package
      version: "1.0.0"
      path: D:/1_omas/MODLIB/content_manufacturing/interface_protocols/IF-B_video_package.schema.json
    - id: IF-C_card_package
      version: "1.0.0"
      path: D:/1_omas/MODLIB/content_manufacturing/interface_protocols/IF-C_card_package.schema.json

